<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product - Zephyr (Soft Breeze)</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        /* --- TEMA UTAMA: ANGIN LEMBUT (SOFT BREEZE) --- */
        :root {
            --bg-gradient: linear-gradient(135deg, #f0fdf4 0%, #e0f2fe 100%);
            --card-bg: rgba(255, 255, 255, 0.85);
            --text-main: #334155;
            --text-muted: #64748b;
            --accent-soft: #7dd3fc;
            --accent-hover: #38bdf8;
            --border-color: #e2e8f0;
            --shadow-soft: 0 10px 30px -10px rgba(148, 163, 184, 0.2);
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background: var(--bg-gradient);
            color: var(--text-main);
            margin: 0;
            padding: 0;
            min-height: 100vh;
        }

        /* --- NAVIGATION BAR --- */
        nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 8%;
            background: rgba(255, 255, 255, 0.5);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--border-color);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        nav .logo {
            font-weight: 700;
            font-size: 22px;
            letter-spacing: 2px;
            color: var(--text-main);
        }

        nav ul {
            list-style: none;
            display: flex;
            gap: 30px;
            margin: 0;
            padding: 0;
        }

        nav ul li a {
            text-decoration: none;
            color: var(--text-muted);
            font-weight: 500;
            font-size: 15px;
            transition: color 0.3s ease;
        }

        nav ul li a:hover, nav ul li a.active {
            color: var(--text-main);
            font-weight: 600;
        }

        /* --- CONTAINER WORKSPACE --- */
        .workspace-container {
            max-width: 1200px;
            margin: 40px auto;
            padding: 0 20px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 30px;
        }

        @media (max-width: 900px) {
            .workspace-container { grid-template-columns: 1fr; }
        }

        .card {
            background: var(--card-bg);
            backdrop-filter: blur(16px);
            border: 1px solid var(--border-color);
            border-radius: 24px;
            padding: 35px;
            box-shadow: var(--shadow-soft);
        }

        .card-title {
            font-size: 20px;
            font-weight: 700;
            margin-bottom: 6px;
            color: var(--text-main);
        }

        .card-subtitle {
            font-size: 13px;
            color: var(--text-muted);
            margin-bottom: 25px;
        }

        /* --- FITUR 1: TIMER FOKUS --- */
        .timer-display {
            font-size: 64px;
            font-weight: 700;
            text-align: center;
            margin: 20px 0;
            font-variant-numeric: tabular-nums;
            letter-spacing: -1px;
        }

        .timer-controls {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-bottom: 25px;
        }

        .btn {
            padding: 12px 28px;
            border-radius: 12px;
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            border: none;
            transition: all 0.2s ease;
        }

        .btn-primary { background: var(--accent-soft); color: #0369a1; }
        .btn-primary:hover { background: var(--accent-hover); }
        .btn-secondary { background: #e2e8f0; color: #475569; }
        .btn-secondary:hover { background: #cbd5e1; }

        .spotify-container {
            margin-top: 20px;
            border-radius: 16px;
            overflow: hidden;
            border: 1px solid var(--border-color);
        }

        /* --- FITUR 2: TO-DO LIST --- */
        .input-group {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        .input-group input {
            flex: 1;
            padding: 14px 18px;
            border-radius: 12px;
            border: 1px solid var(--border-color);
            background: rgba(255,255,255,0.6);
            font-family: inherit;
            font-size: 14px;
        }

        .input-group input:focus {
            outline: none;
            border-color: var(--accent-hover);
        }

        .task-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
            max-height: 280px;
            overflow-y: auto;
        }

        .task-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 14px 18px;
            background: rgba(255, 255, 255, 0.5);
            border: 1px solid var(--border-color);
            border-radius: 12px;
        }

        .task-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .task-item input[type="checkbox"] {
            width: 18px;
            height: 18px;
            accent-color: var(--accent-hover);
            cursor: pointer;
        }

        .task-text.completed {
            text-decoration: line-through;
            color: var(--text-muted);
        }

        .btn-delete {
            background: none;
            border: none;
            color: #ef4444;
            cursor: pointer;
            font-size: 16px;
        }

        /* --- FITUR 3: MOOD TRACKER (BAWAH) --- */
        .mood-section {
            grid-column: 1 / -1;
        }

        .mood-options {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin: 20px 0;
            flex-wrap: wrap;
        }

        .mood-btn {
            background: white;
            border: 1px solid var(--border-color);
            padding: 15px 25px;
            border-radius: 16px;
            cursor: pointer;
            font-size: 15px;
            font-weight: 500;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .mood-btn:hover {
            transform: translateY(-2px);
            border-color: var(--accent-hover);
            box-shadow: var(--shadow-soft);
        }

        .mood-report-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
            gap: 15px;
            margin-top: 20px;
        }

        /* --- MODAL DAFTAR/LOGIN (DI AWAL) --- */
        .auth-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(240, 253, 244, 0.95);
            z-index: 1000;
            display: none;
            justify-content: center;
            align-items: center;
        }

        .auth-box {
            background: white;
            padding: 40px;
            border-radius: 24px;
            box-shadow: var(--shadow-soft);
            width: 100%;
            max-width: 400px;
            border: 1px solid var(--border-color);
            text-align: center;
        }
    </style>
</head>
<body>

    <div id="authModal" class="auth-overlay">
        <div class="auth-box">
            <h2 id="authTitle" style="margin-bottom: 10px;">Masuk ke Zephyr</h2>
            <p style="font-size: 13px; color: var(--text-muted); margin-bottom: 25px;">Kelola fokus selembut embusan angin.</p>
            
            <div style="display: flex; flex-direction: column; gap: 15px; text-align: left;">
                <div>
                    <label style="font-size: 13px; font-weight: 600;">Username</label>
                    <input type="text" id="authUsername" class="input-group" style="width:100%; padding:12px; border-radius:10px; border:1px solid var(--border-color); margin-top:5px;">
                </div>
                <div>
                    <label style="font-size: 13px; font-weight: 600;">Password</label>
                    <input type="password" id="authPassword" class="input-group" style="width:100%; padding:12px; border-radius:10px; border:1px solid var(--border-color); margin-top:5px;">
                </div>
                
                <button class="btn btn-primary" id="btnSubmitAuth" onclick="handleAuthSubmit()" style="width:100%; margin-top:10px;">Masuk Sekarang</button>
                <p id="authToggleText" style="text-align:center; font-size:13px; color: var(--text-muted); cursor:pointer;" onclick="toggleAuthMode()">Belum punya akun? Daftar akun baru di sini</p>
            </div>
        </div>
    </div>

    <nav>
        <div class="logo">ZEPHYR</div>
        <ul>
            <li><a href="/">home</a></li>
            <li><a href="/design">design</a></li>
            <li><a href="/product" class="active">product</a></li>
            <li><a href="#" onclick="triggerLogout()" style="color:#ef4444;">logout</a></li>
        </ul>
    </nav>

    <div class="workspace-container">
        
        <div class="card">
            <div class="card-title">⏱️ Timer & Musik</div>
            <div class="card-subtitle">Atur durasi fokus dan putar playlist Spotify favoritmu.</div>
            
            <div style="display: flex; gap: 10px; margin-bottom: 15px;">
                <input type="number" id="inputMinutes" value="25" min="1" max="120" style="width:70px; padding:10px; border-radius:10px; border:1px solid var(--border-color); text-align:center;">
                <span style="align-self: center; font-size:14px; font-weight:500;">Menit</span>
                <button class="btn btn-secondary" onclick="setCustomTime()" style="padding: 5px 15px;">Set</button>
            </div>

            <div class="timer-display" id="timerDisplay">25:00</div>
            
            <div class="timer-controls">
                <button class="btn btn-primary" id="btnStart" onclick="startTimer()">Mulai</button>
                <button class="btn btn-secondary" onclick="pauseTimer()">Jeda</button>
                <button class="btn btn-secondary" onclick="resetTimer()">Reset</button>
            </div>

            <div class="spotify-container">
                <iframe src="https://open.spotify.com/embed/playlist/37i9dQZF1PX869085817a0?utm_source=generator" 
                        width="100%" height="152" allowfullscreen="" allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture" loading="lazy"></table>
            </div>
        </div>

        <div class="card">
            <div class="card-title">📝 List Tugas</div>
            <div class="card-subtitle">Centang tugas yang sukses kamu selesaikan.</div>
            
            <div class="input-group">
                <input type="text" id="taskInput" placeholder="Ketik tugas barumu di sini...">
                <button class="btn btn-primary" onclick="addNewTask()">Tambah</button>
            </div>

            <div class="task-list" id="taskListContainer">
                </div>
        </div>

        <div class="card mood-section">
            <div class="card-title">📊 Pelacak Emosi & Riwayat Bulanan</div>
            <div class="card-subtitle">Bagaimana kondisi mental atau perasaanmu hari ini?</div>
            
            <div class="mood-options">
                <button class="mood-btn" onclick="submitMood('bahagia')">😊 Bahagia</button>
                <button class="mood-btn" onclick="submitMood('biasa')">😐 Biasa Saja</button>
                <button class="mood-btn" onclick="submitMood('lelah')">🙁 Lelah / Stres</button>
            </div>

            <div class="mood-report-grid" id="moodReportContainer">
                </div>
        </div>

    </div>

    <script>
    let timerInterval;
    let totalSeconds = 1500; 
    let isTimerRunning = false;
    let currentAuthMode = "login";

    // --- 1. PROSES AUTENTIKASI DI STREAMLIT COUPLING ---
    function showAuthModal() {
        document.getElementById('authModal').style.display = 'flex';
    }

    function toggleAuthMode() {
        if(currentAuthMode === "login") {
            currentAuthMode = "register";
            document.getElementById('authTitle').innerText = "Buat Akun Baru";
            document.getElementById('btnSubmitAuth').innerText = "Daftar Akun";
            document.getElementById('authToggleText').innerText = "Sudah punya akun? Masuk di sini";
        } else {
            currentAuthMode = "login";
            document.getElementById('authTitle').innerText = "Masuk ke Zephyr";
            document.getElementById('btnSubmitAuth').innerText = "Masuk Sekarang";
            document.getElementById('authToggleText').innerText = "Belum punya akun? Daftar akun baru di sini";
        }
    }

    function handleAuthSubmit() {
        const u = document.getElementById('authUsername').value.trim();
        const p = document.getElementById('authPassword').value;
        if(!u || !p) return alert("Harap isi username & password!");

        window.parent.location.href = window.parent.location.pathname + `?action=${currentAuthMode}&u=${encodeURIComponent(u)}&p=${encodeURIComponent(p)}`;
    }

    function triggerLogout() {
        window.parent.location.href = window.parent.location.pathname + '?logout=true';
    }

    // --- 2. LOGIKA KUSTOM TIMER JAVASCRIPT ---
    function updateDisplay() {
        const minutes = Math.floor(totalSeconds / 60);
        const seconds = totalSeconds % 60;
        document.getElementById('timerDisplay').innerText = `${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;
    }

    function setCustomTime() {
        const mins = parseInt(document.getElementById('inputMinutes').value);
        if (mins > 0) {
            totalSeconds = mins * 60;
            updateDisplay();
            pauseTimer();
        }
    }

    function startTimer() {
        if (isTimerRunning) return;
        isTimerRunning = true;
        document.getElementById('btnStart').innerText = "Berjalan...";
        timerInterval = setInterval(() => {
            if (totalSeconds > 0) {
                totalSeconds--;
                updateDisplay();
            } else {
                clearInterval(timerInterval);
                isTimerRunning = false;
                document.getElementById('btnStart').innerText = "Mulai";
                alert("Sesi fokus selesai! Selembut embusan angin, ayo isi mood-mu di bawah.");
            }
        }, 1000);
    }

    function pauseTimer() {
        clearInterval(timerInterval);
        isTimerRunning = false;
        document.getElementById('btnStart').innerText = "Mulai";
    }

    function resetTimer() {
        pauseTimer();
        setCustomTime();
    }

    // --- 3. TO-DO LIST BERFUNGSI CHECKBOX INTERAKTIF ---
    let localTasks = [];

    function addNewTask() {
        const input = document.getElementById('taskInput');
        const text = input.value.trim();
        if(!text) return;

        localTasks.push({ task_name: text, completed: false });
        input.value = "";
        renderTasks();
        sendTasksToStreamlit();
    }

    function toggleTask(index) {
        localTasks[index].completed = !localTasks[index].completed;
        renderTasks();
        sendTasksToStreamlit();
    }

    function deleteTask(index) {
        localTasks.splice(index, 1);
        renderTasks();
        sendTasksToStreamlit();
    }

    function renderTasks() {
        const container = document.getElementById('taskListContainer');
        container.innerHTML = "";
        localTasks.forEach((task, idx) => {
            const div = document.createElement('div');
            div.className = 'task-item';
            div.innerHTML = `
                <div class="task-left">
                    <input type="checkbox" ${task.completed ? 'checked' : ''} onclick="toggleTask(${idx})">
                    <span class="task-text ${task.completed ? 'completed' : ''}">${task.task_name}</span>
                </div>
                <button class="btn-delete" onclick="deleteTask(${idx})">🗑️</button>
            `;
            container.appendChild(div);
        });
    }

    function sendTasksToStreamlit() {
        // Mengirimkan array data tugas ke server Python Streamlit di belakang layar
        window.parent.location.href = window.parent.location.pathname + `?save_tasks=true&tasks_data=${encodeURIComponent(JSON.stringify(localTasks))}`;
    }

    // --- 4. MOOD TRACKER & JURNAL ---
    function submitMood(moodValue) {
        window.parent.location.href = window.parent.location.pathname + `?save_mood=true&mood=${moodValue}`;
    }

    // --- 5. DETEKSI DATA OTOMATIS SAAT HALAMAN DIBUKA ---
    window.addEventListener('DOMContentLoaded', () => {
        // Cek status login session pengguna
        if (!window.current_user) {
            showAuthModal();
        } else {
            document.getElementById('authModal').style.display = 'none';
            
            // Masukkan data tugas dari Python ke list HTML
            if (window.initial_tasks) {
                localTasks = window.initial_tasks;
                renderTasks();
            }

            // Masukkan riwayat bulanan emosi ke grid bawah
            if (window.initial_moods) {
                const reportContainer = document.getElementById('moodReportContainer');
                reportContainer.innerHTML = "";
                Object.entries(window.initial_moods).forEach(([tanggal, mood]) => {
                    let emoji = mood === 'bahagia' ? '😊' : mood === 'biasa' ? '😐' : '🙁';
                    reportContainer.innerHTML += `
                        <div style="background: white; padding: 15px; border-radius: 16px; border: 1px solid var(--border-color); text-align: center; box-shadow: var(--shadow-soft);">
                            <div style="font-size: 11px; color: var(--text-muted);">${tanggal}</div>
                            <div style="font-size: 26px; margin: 5px 0;">${emoji}</div>
                            <div style="font-weight: 600; font-size: 13px; text-transform: capitalize;">${mood}</div>
                        </div>
                    `;
                });
            }
        }
    });
    </script>
</body>
</html>
