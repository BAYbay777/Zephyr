<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Design - Zephyr (Soft Breeze)</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-gradient: linear-gradient(135deg, #f0fdf4 0%, #e0f2fe 100%);
            --card-bg: rgba(255, 255, 255, 0.85);
            --text-main: #334155;
            --text-muted: #64748b;
            --border-color: #e2e8f0;
            --shadow-soft: 0 10px 30px -10px rgba(148, 163, 184, 0.2);
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background: var(--bg-gradient);
            color: var(--text-main);
            margin: 0;
            padding: 0;
            min-height: 100vh;
        }

        nav {
            background: rgba(255, 255, 255, 0.5);
            backdrop-filter: blur(10px);
            padding: 15px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border-color);
        }

        nav .logo {
            font-weight: 700;
            font-size: 20px;
            letter-spacing: 2px;
            color: #0284c7;
        }

        nav ul {
            list-style: none;
            display: flex;
            gap: 30px;
            margin: 0;
            padding: 0;
        }

        nav ul li a {
            text-decoration: none;
            color: var(--text-muted);
            font-weight: 500;
            transition: color 0.3s ease;
        }

        nav ul li a:hover, nav ul li a.active {
            color: #0284c7;
        }

        .container {
            max-width: 1000px;
            margin: 50px auto;
            padding: 0 20px;
        }

        .header-title {
            text-align: center;
            margin-bottom: 40px;
        }

        .header-title h1 {
            color: #0f172a;
            font-size: 36px;
            font-weight: 700;
            margin: 0 0 10px 0;
        }

        .header-title p {
            color: var(--text-muted);
            font-size: 16px;
            margin: 0;
        }

        .card {
            background: var(--card-bg);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 40px;
            border: 1px solid rgba(255, 255, 255, 0.6);
            box-shadow: var(--shadow-soft);
            margin-bottom: 30px;
        }

        .card h2 {
            margin-top: 0;
            color: #0f172a;
            font-size: 24px;
            font-weight: 600;
            border-left: 4px solid #38bdf8;
            padding-left: 15px;
        }

        .card p {
            line-height: 1.7;
            color: var(--text-main);
        }

        /* Responsif untuk embed berkas atau gambar materi */
        .embed-container {
            position: relative;
            padding-bottom: 56.25%;
            height: 0;
            overflow: hidden;
            max-width: 100%;
            border-radius: 12px;
            margin-top: 20px;
            border: 1px solid var(--border-color);
        }

        .embed-container iframe {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            border: 0;
        }
    </style>
</head>
<body>

    <nav>
        <div class="logo">ZEPHYR</div>
        <ul>
            <li><a href="index.html">home</a></li>
            <li><a href="/design" class="active">design</a></li>
            <li><a href="Product.html">product</a></li>
        </ul>
    </nav>

    <div style="position: relative; width: 100%; height: 0; padding-top: 393.5578%;
 padding-bottom: 0; box-shadow: 0 2px 8px 0 rgba(63,69,81,0.16); margin-top: 1.6em; margin-bottom: 0.9em; overflow: hidden;
 border-radius: 8px; will-change: transform;">
  <iframe loading="lazy" style="position: absolute; width: 100%; height: 100%; top: 0; left: 0; border: none; padding: 0;margin: 0;"
    src="https://www.canva.com/design/DAHLnZQcr20/QRCD5ViXkZuGKs31QrTvzw/view?embed" allowfullscreen="allowfullscreen" allow="fullscreen">
  </iframe>
</div>

</body>
</html>
