<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Design - Zephyr (Soft Breeze)</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        /* --- TEMA UTAMA: ANGIN LEMBUT (SOFT BREEZE) --- */
        :root {
            --bg-gradient: linear-gradient(135deg, #f0fdf4 0%, #e0f2fe 100%);
            --text-main: #334155;
            --text-muted: #64748b;
            --border-color: #e2e8f0;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background: var(--bg-gradient);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* --- BAR NAVIGASI --- */
        nav {
            background: rgba(255, 255, 255, 0.6);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            padding: 20px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border-color);
        }

        nav .logo {
            font-weight: 700;
            font-size: 20px;
            letter-spacing: 2px;
            color: #0284c7;
        }

        nav ul {
            list-style: none;
            display: flex;
            gap: 30px;
        }

        nav ul li {
            display: inline;
        }

        nav ul li a {
            text-decoration: none;
            color: var(--text-muted);
            font-weight: 500;
            font-size: 16px;
            text-transform: lowercase;
            transition: color 0.3s ease;
        }

        nav ul li a:hover, nav ul li a.active {
            color: #0284c7;
        }

        /* --- JUDUL HALAMAN --- */
        .page-title {
            text-align: center;
            font-size: 56px;
            font-weight: 700;
            color: #0f172a;
            margin-top: 50px;
            margin-bottom: 10px;
            letter-spacing: -1px;
        }

        /* --- WADAH EMBED CANVA (RESPONSIF TINGGI) --- */
        .canva-wrapper {
            max-width: 900px;
            width: 90%;
            margin: 20px auto 60px auto;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.05);
            border-radius: 16px;
            overflow: hidden;
            background: white;
            border: 1px solid var(--border-color);
        }

        .canva-container {
            position: relative;
            width: 100%;
            height: 0;
            /* Rasio aspek tinggi khusus untuk dokumen infografis/materi panjang Canva */
            padding-top: 142%; 
        }

        .canva-container iframe {
            position: absolute;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            border: none;
        }

        /* Responsif Layar Kecil (HP) */
        @media (max-width: 600px) {
            .page-title {
                font-size: 40px;
                margin-top: 30px;
            }
            nav {
                padding: 15px 20px;
            }
        }
    </style>
</head>
<body>

    <nav>
        <div class="logo">ZEPHYR</div>
        <ul>
            <li><a href="index.html">home</a></li>
            <li><a href="design.html" class="active">design</a></li>
            <li><a href="Product.html">product</a></li>
        </ul>
    </nav>

    <h1 class="page-title">DESIGN</h1>

    <div class="canva-wrapper">
        <div class="canva-container">
            <iframe
             loading="lazy" 
             src="https://www.canva.com/design/DAHHQJrjw0U/2mtxScgkRspmjV5Y0ZqGBA/view?embed" 
             allowfullscreen="allowfullscreen" 
             allow="fullscreen">
            </iframe>
        </div>
    </div>

</body>
</html>
